name: OpenWeb APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: JDK kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: İmzalama anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENWEB_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openweb.jks"

      - name: APK derle ve imzala
        env:
          KS_PATH: ${{ runner.temp }}/openweb.jks
          KS_PASS: ${{ secrets.OPENWEB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPENWEB_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.OPENWEB_KEY_PASSWORD }}
        run: |
          cat >> app/build.gradle.kts <<'GRADLE'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KS_PATH"))
                      storePassword = System.getenv("KS_PASS")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASS")
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          GRADLE
          gradle assembleDebug

      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: OpenWeb-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
